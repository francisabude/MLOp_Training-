grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 5
    verbose: 1
    n_jobs: -1
    scoring: f1_weighted

model_selection:
  module_0:
    class: LogisticRegression
    module: sklearn.linear_model
    params:
      max_iter: 1000
    search_param_grid:
      C:
        - 0.1
        - 1.0
        - 10.0

  module_1:
    class: KNeighborsClassifier
    module: sklearn.neighbors
    params:
      weights: distance
    search_param_grid:
      n_neighbors:
        - 5
        - 15
        - 31

  module_2:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      random_state: 42
    search_param_grid:
      n_estimators:
        - 100
        - 300
      max_depth:
        - 4
        - 8
        - null

  module_3:
    class: GradientBoostingClassifier
    module: sklearn.ensemble
    params:
      random_state: 42
    search_param_grid:
      n_estimators:
        - 100
        - 200
      learning_rate:
        - 0.05
        - 0.1
